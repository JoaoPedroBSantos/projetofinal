# Serves the built React SPA and reverse-proxies the API + assets so the whole
# app is same-origin (no CORS, cookies work with SameSite=Strict).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product photo uploads are capped server-side at 6 MB; allow a little slack.
    client_max_body_size 8m;

    # Docker's embedded DNS. The API's IP changes whenever its container is
    # recreated, so the upstream is resolved per request instead of once at
    # startup (which would break nginx with 502 after an API restart).
    # __RESOLVER__ é substituído pelo entrypoint (docker-entrypoint.sh) com o
    # nameserver do próprio container (127.0.0.11 no Docker, IP do Podman).
    resolver __RESOLVER__ ipv6=off valid=10s;

    # API.
    location /api/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fotos de produtos: a API lê do SeaweedFS em /assets/uploads/.
    location /assets/uploads/ {
        set $api_upstream http://api:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Demais assets (logo, food truck) vêm do build do SPA.
    location /assets/ {
        try_files $uri =404;
    }

    # Admin SPA entry point.
    location = /admin {
        add_header X-Robots-Tag "noindex" always;
        try_files /admin.html =404;
    }
    location /admin/ {
        add_header X-Robots-Tag "noindex" always;
        try_files $uri /admin.html;
    }

    # Public SPA (client-side routing fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
